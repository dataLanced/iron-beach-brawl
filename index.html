<meta charset="utf-8">
<title>Iron Beach Brawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one full-bleed arcade cabinet screen, HUD baked into the canvas, touch pad below on phones */
:root {
  --ink: #1b1530;        /* night-sea violet, page ground */
  --panel: #2a2146;
  --sun: #ff9a3c;        /* boardwalk sunset accent */
  --coral: #ff5d6c;
  --foam: #f6ecd8;
  --muted: #a99cc8;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --pixel: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--foam);
  font-family: var(--pixel);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-inline: 16px; padding-block: 12px; box-sizing: border-box; gap: 10px;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
#stage {
  position: relative; width: 100%; max-width: 1100px; aspect-ratio: 16 / 9;
  max-height: calc(100% - 24px);
  border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 3px var(--panel), 0 18px 50px rgba(0,0,0,.5);
  background: #000;
}
@media (max-aspect-ratio: 16/10) { #stage { max-height: none; } }
canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
.help {
  font-size: 11px; letter-spacing: .08em; color: var(--muted); text-align: center;
  display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; max-width: 1100px;
}
.help b { color: var(--sun); font-weight: 700; }
#pad { display: none; width: 100%; max-width: 1100px; justify-content: space-between; align-items: center; gap: 12px; }
@media (pointer: coarse) { #pad { display: flex; } .help { display: none; } }
.dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
.pbtn {
  background: var(--panel); color: var(--foam); border: 2px solid #4a3d73; border-radius: 10px;
  font-family: var(--pixel); font-size: 16px; touch-action: none; display: grid; place-items: center;
}
.pbtn.on { background: #4a3d73; }
#bU { grid-column: 2; grid-row: 1; } #bL { grid-column: 1; grid-row: 2; }
#bR { grid-column: 3; grid-row: 2; } #bD { grid-column: 2; grid-row: 3; }
#bP {
  width: 96px; height: 96px; border-radius: 50%; background: var(--coral); border-color: #ffb0b8;
  font-family: var(--display); font-size: 15px; color: var(--ink);
}
#bT { width: 64px; height: 36px; font-size: 11px; align-self: flex-start; }
#bK { width: 80px; height: 80px; border-radius: 50%; background: #5b8cff; border-color: #a9c2ff; font-family: var(--display); font-size: 14px; color: var(--ink); align-self: flex-end; }
#bJ { width: 64px; height: 64px; border-radius: 50%; background: #52c46a; border-color: #a6efb4; font-family: var(--display); font-size: 12px; color: var(--ink); align-self: flex-end; }
#bP.on, #bK.on, #bJ.on { background: var(--sun); }
.atk { display: flex; gap: 12px; align-items: flex-start; }
button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #stage { box-shadow: 0 0 0 3px var(--panel); } }
</style>

<div id="stage"><canvas id="c" width="960" height="540" tabindex="0" aria-label="Iron Beach Brawl game screen"></canvas></div>
<div class="help">
  <span><b>WASD / ARROWS</b> MOVE</span>
  <span><b>J / Z / SPACE</b> PUNCH</span>
  <span><b>K / X</b> KICK</span>
  <span><b>L / C / SHIFT</b> JUMP (SUNNY)</span>
  <span><b>DOUBLE-TAP</b> RUN · <b>WALK INTO</b> GRAB (SUNNY)</span>
  <span><b>TAP AGAIN</b> TO EXTEND, MIX FOR STRINGS</span>
  <span><b>MASH</b> TO BREAK A GRAB</span>
  <span><b>FACE THEM</b> OR GET SUPLEXED</span>
  <span><b>P</b> PAUSE</span>
  <span><b>ENTER</b> START · <b>◀ ▶</b> PICK FIGHTER</span>
  <span><b>V</b> VERSUS</span>
  <span><b>ESC</b> BACK TO SELECT</span>
  <span><b>T</b> TITLE SCREEN</span>
</div>
<div id="pad">
  <div class="dpad">
    <button class="pbtn" id="bU" aria-label="Up">▲</button>
    <button class="pbtn" id="bL" aria-label="Left">◀</button>
    <button class="pbtn" id="bR" aria-label="Right">▶</button>
    <button class="pbtn" id="bD" aria-label="Down">▼</button>
  </div>
  <button class="pbtn" id="bT" aria-label="Back to title screen">TITLE</button>
  <div class="atk">
    <button class="pbtn" id="bJ" aria-label="Jump">JUMP</button>
    <button class="pbtn" id="bK" aria-label="Kick">KICK</button>
    <button class="pbtn" id="bP" aria-label="Punch">PUNCH</button>
  </div>
</div>

}

// shuriken in flight
function updateShots(dt) {
  for (const s of game.shots) {
    s.t += dt; s.x += s.vx * dt;
    if (s.air) {
      s.z += s.vz * dt;
      if (s.z <= 4) { s.dead = true; dust(s.x, s.y, 2); audio.thump(1200, .03, .1); continue; }   // sticks in the boards
      if (heroHittable() && hero.state !== 'held' && Math.abs(hero.y - s.y) < 24 && Math.abs(hero.x - s.x) < 34 && s.z < 150) {
        s.dead = true; damage(hero, { dmg: Math.round(8 * ((s.owner && s.owner.dmgMul) || 1)), kb: 140, reach: 999 }, { x: s.x - Math.sign(s.vx) * 20, face: Math.sign(s.vx) });
      }
      if (s.x < game.cam - 120 || s.x > game.cam + W + 120) s.dead = true;
      continue;
    }
    const dir = Math.sign(s.vx);
    // a punch or kick in her face knocks it out of the air
    const hm = MOVES[hero.state];
    if (!s.fire && hm && hm[hero.fi] && hm[hero.fi].hit && hero.face === -dir && Math.abs(hero.y - s.y) < 28 && (s.x - hero.x) * hero.face > 0 && Math.abs(s.x - hero.x) < 120) {
      s.dead = true; audio.thump(900, .05, .2);
      game.fx.push({ k: 'block', x: s.x, y: s.y - s.z, t: 0, life: .25 });
      game.score += 50; continue;
    }
    if (heroHittable() && hero.state !== 'held' && Math.abs(hero.y - s.y) < 22 && Math.abs(hero.x - s.x) < 26) {
      s.dead = true; damage(hero, { dmg: Math.round((s.fire ? 9 : 7) * ((s.owner && s.owner.dmgMul) || 1)), kb: s.fire ? 180 : 120, reach: 999 }, { x: s.x - dir * 20, face: dir });
      if (s.fire) kunaiEmbers({ x: hero.x, y: hero.y - 20 }, 10, 50);
    }
    if (s.x < game.cam - 120 || s.x > game.cam + W + 120) s.dead = true;

}
function drawShots() {

  for (const s of game.shots) {

      ctx.fillStyle = 'rgba(20,10,40,.2)'; ctx.beginPath(); ctx.ellipse(sx, s.y, 9, 3, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(sx, s.y - s.z); ctx.scale(dir, 1); ctx.rotate(ang); ctx.scale(sc, sc);
      ctx.drawImage(sheets[s.owner.sheet], fr.x, fr.y || 0, fr.w, fr.h, -fr.w * .66, -fr.h * .62, fr.w, fr.h); ctx.restore();
      continue;
    }

    ctx.fillStyle = 'rgba(20,10,40,.25)'; ctx.beginPath(); ctx.ellipse(sx, s.y, 12, 4, 0, 0, 7); ctx.fill();
    const o = s.owner || {}, fr = (o.frames || NFRAMES).star[0], ss = 1.1 * (o.frames === MNFRAMES ? NFRAMES.star[0].w / fr.w : 1);
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(sx, s.y - s.z); ctx.scale(dir * ss, ss);
    ctx.drawImage(sheets[s.owner && s.owner.sheet] || sheets.ninja_red, fr.x, fr.y || 0, fr.w, fr.h, -fr.ax, -fr.ay, fr.w, fr.h); ctx.restore();
  }

  for (const e of game.enemies) {
    if (e.cls !== 'ninja' || e.state !== 'lightning' || e.ltX == null) continue;
    const mx = e.ltX - game.cam, my = e.ltY;
    if (e.si >= 5 && e.si < 10) {

      ctx.strokeStyle = `rgba(190,120,255,${.35 + p * .5})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(mx, my, 60 - p * 18, 16 - p * 5, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = `rgba(170,90,255,${.12 + .12 * pulse})`; ctx.fill();
    }
    if (e.si >= 10 && e.si <= 15 && e.si % 2 === 0) {
      for (let b = 0; b < 2; b++) {
        let x = mx + (b ? 18 : -10) + (Math.random() - .5) * 20, y = -10;
        ctx.strokeStyle = b ? 'rgba(255,240,255,.95)' : 'rgba(170,90,255,.7)'; ctx.lineWidth = b ? 3 : 9; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, y);

        ctx.stroke();

    ctx.fillText('!', sx, e.y - 168);
  }
}

  const f = makeHero({ x: x + game.cam, y: y }); f.ft2 = game.t * 1000 + 345;
  drawFighter(f);
  ctx.textAlign = 'center'; ctx.font = '700 12px Silkscreen, monospace'; ctx.fillStyle = '#ffd36b';
  ctx.fillText('◀ ' + PCS[game.pc].name + ' ▶', x, y + 36);
}

/* ---------- SCOUT: the third playable character (placeholder name) ---------- */
// so far: idle and her light chain: jab -> standing elbow -> uppercut finisher that launches.
// Kick borrows the same string until her kicks arrive.
// Jump (L/C/Shift): kick in the air = jump kick, punch in the air = diving elbow drop.
// Grab: kick = shin kicks (up to 3) into the backflip somersault kick; down + punch = judo slam; away + punch = leg toss.
// In the air: punch + toward a nearby enemy = air slam (piledriver). Double-tap a direction to run.
// Specials: forward, forward + punch = knife dash slash. Walk into an enemy = grab; punch in the grab = leaping neck choke
// (each punch press adds a squeeze, up to 3), finished by the knife dislodge that kicks them off.
// Hurt row covers flinch, held, dizzy, knockdown (toppled stagger -> hands and knees) and KO.
PCS.scout = { name: 'SCOUT' };
const P3_PUNCH = [
  { a: 'jab', f: 0, ms: 55, dflt: 1 },                                                     // guard
  { a: 'jab', f: 1, ms: 110, hit: { dmg: 6, kb: 80, reach: 116 }, next: 2, dflt: 3 },
  { a: 'elbow', f: 0, ms: 150, hit: { dmg: 8, kb: 120, reach: 100 }, next: 3, dflt: 6 },
  { a: 'upper', f: 0, ms: 120 , dflt: 4 },                                                 // dip and wind up
  { a: 'upper', f: 1, ms: 190, hit: { dmg: 15, kb: 120, reach: 112, big: true, launchE: 760 }, dflt: 5 },
  { a: 'upper', f: 2, ms: 230, dflt: -1 },                                                 // fist held high
  { a: 'jab', f: 0, ms: 110, dflt: -1 },                                                   // recover
];
const isP3 = f => f.frames === P3FRAMES;
// knocked down / KO'd: her own row does the falling, so no toppling rotation.
// flying back: frame 0 (reeling); on landing she buckles (1), drops to hands and knees (2) and goes flat on her face (3);
// getting up runs it backwards: hands and knees, crouch, then she's back on her feet.
const P3_UP = .78;   // time from landing until she's back on her feet
function p3DownFrame(f) {
  f.rot = 0;
  if (f.st < (f.p3dst || 0) || f.state !== f.p3dstate) { f.p3land = null; f.p3dstate = f.state; f.p3air = f.z > 0; }   // a fresh knockdown
  f.p3dst = f.st;
  if (f.z > 0 && f.p3land == null) { f.p3air = true; return ['down', 0]; }
  if (f.p3land == null) f.p3land = f.p3air ? f.st : f.st - 1;   // dropped where she stood (pinned, crushed): already flat
  const lt = f.st - f.p3land;
  const up = P3_UP + (f.downHold || 0);
  if (f.state === 'down' && lt > up - .27) return ['down', lt > up - .12 ? 1 : 2];
  return ['down', lt < .07 ? 1 : lt < .16 ? 2 : 3];
}
function p3Frame(f) {
  if (f.p3ca && P3_OWN.has(f.state)) return [f.p3ca, f.p3cfi];
  if (MOVES[f.state]) { const st = MOVES[f.state][f.fi]; return [st.a, st.f]; }
  // hurt row: 0 flinch, 1 big recoil (eyes shut), 2 stagger, 3 on hands and knees
  if (f.state === 'hurt') return ['hurt', f.st < .12 ? 1 : 0];
  if (f.state === 'held') return ['hurt', 1];
  if (f.state === 'dizzy') return ['hurt', Math.floor(f.st / .35) % 2 ? 2 : 3];
  if ((f.state === 'ko' || f.state === 'down') && f.frames.down) return p3DownFrame(f);
  if (f.state === 'ko') return ['hurt', 2];
  if (f.state === 'down') { if (f.z === 0 && f.st > .75) { f.rot = 0; return ['hurt', 3]; } return ['hurt', 2]; }
  if (f.state === 'drop' || f.state === 'victory') return ['idle', 0];
  if (f.anim === 'run') return ['run', Math.floor(f.ft2 / 70) % 6];
  if (f.anim === 'walk' || f.anim === 'back') return ['walk', Math.floor(f.ft2 / 95) % 6];
  return ['idle', Math.floor(f.ft2 / 150) % 4];
}
// the uppercut sends anyone light enough flying straight up; they take the damage when they land (heavies and guards just take a big hit)
function p3Launch(t, hit, att) {
  if (!hit.launchE || t === hero || t.state === 'ko' || t.delay > 0 || t.inv > 0 || t.hp <= 0) return false;
  if (t.cls === 'sumo' || t.cls === 'vex' || (t.cls === 'school' && t.od) || t.armor || t.state === 'guard' || t.state === 'pheld' || t.state === 'ptoss') return false;
  if (t.holding) releaseGrab(t);
  game.hitstop = .12; game.shake = Math.max(game.shake, 10); audio.hit(true);
  game.fx.push({ k: 'spark', x: t.x - att.face * 6, y: t.y - 110, t: 0, life: .3, big: true });
  game.fx.push({ k: 'tag', x: t.x, y: t.y - 190, t: 0, life: .7, txt: 'UPPERCUT!' });
  game.comboCount++; game.comboTimer = 1.4; game.score += hit.dmg * 10 * Math.max(1, Math.min(game.comboCount, 6));
  p2Throw({}, t, att.face * 90, hit.launchE, hit.dmg, att.face * 1.4);
  return true;
}

// ---------- specials and grab ----------
const P3_GRABS = new Set(['p3grab', 'p3choke', 'p3dis', 'p3shin', 'p3somer', 'p3judo', 'p3leg', 'p3aslam']);
const P3_OWN = new Set(['knife', 'p3grab', 'p3choke', 'p3dis', 'p3shin', 'p3somer', 'p3judo', 'p3leg', 'p3aslam', 'p3jump', 'p3jland']);
function p3Update(h, dt) {
  h.p3ca = null;

  if (S === 'knife') return p3Knife(h, dt);
  if (S === 'p3aslam') return p3AirSlam(h, dt);
  if (P3_GRABS.has(S)) return p3Grab(h, dt);
  if (S === 'p3jump') return p3Air(h, dt);
  if (S === 'p3jland') { h.p3ca = 'jump'; h.p3cfi = 3; h.vx *= .6; h.vy = 0; jumpQueued = false; if (h.st > .13) setState(h, 'idle'); return true; }
  if (MOVES[S]) { jumpQueued = false; return false; }
  if (jumpQueued && S === 'idle') {
    jumpQueued = false; const mx = (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
    setState(h, 'p3jump'); h.lifted = false; h.airAtk = null; h.jvx = mx * h.speed * 1.05; h.vx = 0; h.vy = 0; return true;
  }
  // forward, forward + punch: knife dash slash
  if (atkQueued === 'punch' && h.dashArm != null && game.t - h.dashArm < .4 && (S === 'idle')) {
    atkQueued = null; h.dashArm = null; setState(h, 'knife'); h.vx = 0; h.vy = 0; h.slashed = new Set(); return true;
  }
  // double-tap to run (the run keeps going while the direction is held)
  const mx = (keys.R ? 1 : 0) - (keys.L ? 1 : 0), my = (keys.D ? 1 : 0) - (keys.U ? 1 : 0);
  if (h.dashArm != null && game.t - h.dashArm < .05 && mx) h.running = mx;
  if (h.running && mx !== h.running) h.running = 0;
  if (h.running && S === 'idle' && !atkQueued && !jumpQueued) {
    h.vx = mx * h.speed * 1.85; h.vy = my * h.speed * .55; h.face = mx; h.anim = 'run'; h.pushT = 0;
    return true;
  }
  // walk into an enemy to grab her
  const tgt = mx && S === 'idle' && !atkQueued ? game.enemies.find(e => p2Grabbable(e) && Math.abs(e.y - h.y) < 18 && (e.x - h.x) * mx > 20 && Math.abs(e.x - h.x) < 92) : null;
  h.pushT = tgt ? (h.pushT || 0) + dt : 0;
  if (tgt && h.pushT > .16) {
    setState(h, 'p3grab'); h.grabbed = tgt; h.squeezes = 0; h.vx = 0; h.vy = 0; h.pushT = 0; h.face = Math.sign(tgt.x - h.x) || h.face;
    grabLockAt(tgt, h, tgt.face, tgt.x, false);
    setState(tgt, 'pheld'); tgt.vx = 0; tgt.vy = 0; tgt.heldT = 0; tgt.face = h.face;
    audio.grab(); game.shake = Math.max(game.shake, 4);
    return true;
  }
  return false;
}
function p3Knife(h, dt) {
  // crouch, draw back, dash through with the blade, recover
  const t = h.st; h.vy = 0; h.p3ca = 'knife'; atkQueued = null;
  if (t < .08) { h.p3cfi = 0; h.vx = 0; return true; }
  if (t < .2) { h.p3cfi = 1; h.vx = 0; if (!h.dashed) { h.dashed = true; audio.whiff(); } return true; }
  if (t < .44) {
    h.p3cfi = 2;
    if (t - dt < .2) { audio.noise(.22, 1700, 'bandpass', .35); dust(h.x - h.face * 20, h.y, 4); }
    h.vx = h.face * 760 * (1 - (t - .2) / .24 * .6);
    for (const e of game.enemies) {
      if (h.slashed.has(e) || e.state === 'ko' || e.delay > 0 || (e.inv > 0) || e.state === 'pheld' || e.state === 'ptoss') continue;
      const d = (e.x - h.x) * h.face;
      if (d > -20 && d < 120 && Math.abs(e.y - h.y) < 26 && !(e.z > 40)) {
        h.slashed.add(e); if (e.cls) e.poise = 999;
        damage(e, { dmg: 16, kb: 380, reach: 999, big: true, knock: true }, h);
        game.hitstop = Math.max(game.hitstop, .1); game.shake = Math.max(game.shake, 9);
        game.fx.push({ k: 'tag', x: e.x, y: e.y - 190, t: 0, life: .6, txt: 'KNIFE SLASH!' });
      }
    }
    return true;
  }
  h.p3cfi = 3; h.vx *= Math.pow(.004, dt);

}
function p3Grab(h, dt) {
  const S = h.state, e = h.grabbed; h.vx = 0; h.vy = 0;
  if (S !== 'p3dis' && S !== 'p3somer' && S !== 'p3judo' && S !== 'p3leg' && (!e || e.state !== 'pheld')) { h.grabbed = null; setState(h, 'idle'); return true; }
  const t = h.st;
  if (S === 'p3grab') {
    h.p3ca = 'grab'; h.p3cfi = 0;
    const away = ((keys.R ? 1 : 0) - (keys.L ? 1 : 0)) === -h.face;
    if (atkQueued === 'punch' && away) { atkQueued = null; setState(h, 'p3leg'); h.tossed = false; return true; }
    if (atkQueued === 'punch' && keys.D) { atkQueued = null; setState(h, 'p3judo'); h.slammed = false; return true; }
    if (atkQueued === 'punch') { atkQueued = null; setState(h, 'p3choke'); h.squeezes = 0; h.sqT = 0; h.wantSq = 1; return true; }
    if (atkQueued === 'kick') { atkQueued = null; setState(h, 'p3shin'); h.shins = 0; h.wantShin = 1; h.shinHit = false; return true; }
    if (e.heldT > 2.2 && !e.gLock) { p2Release(h); setState(h, 'idle'); h.vx = -h.face * 120; return true; }
    return true;
  }

    if (t < .26) { h.p3cfi = 1; if (!h.leapt) { h.leapt = true; audio.whiff(); } return true; }

    if (atkQueued) { atkQueued = null; if (h.wantSq < 3) h.wantSq++; }
    const ct = t - .26 - h.squeezes * .34;
    if (h.squeezes < h.wantSq) {
      h.p3cfi = ct < .12 ? 2 : 3;
      if (ct >= .12 && !h.sqHit) { h.sqHit = true; p2HitHeld(e, 6); game.fx.push({ k: 'tag', x: e.x, y: e.y - 185, t: 0, life: .45, txt: 'CHOKE!' }); }
      if (ct >= .34) { h.squeezes++; h.sqHit = false; }
      if (e.hp <= 0) { p3Dislodge(h); }
      return true;
    }

    h.p3cfi = 2;
    if (ct > .45 || h.squeezes >= 3) p3Dislodge(h);

      if (ct >= .3) { h.shins++; h.shinHit = false; }

    h.p3cfi = t < .12 ? 0 : t < .24 ? 1 : t < .38 ? 2 : t < .58 ? 3 : 4;
    if (h.p3cfi === 2 && t - dt < .24) audio.whiff();
    if (h.p3cfi >= 3 && !h.kicked) {
      h.kicked = true;
      if (e && e.state === 'pheld') { game.hitstop = .14; game.shake = 14; audio.hit(true); game.fx.push({ k: 'spark', x: e.x, y: e.y - 110, t: 0, life: .3, big: true }); p2Throw(h, e, h.face * 300, 780, 18, h.face * 2.2); game.fx.push({ k: 'tag', x: h.x, y: h.y - 200, t: 0, life: .8, txt: 'SOMERSAULT!' }); }

  if (t < .52) {
    h.p3cfi = 2;
    if (!h.kicked) {
      h.kicked = true;
      if (e && e.state === 'pheld') { game.hitstop = .12; game.shake = 12; audio.hit(true); p2Throw(h, e, h.face * 420, 300, 10, h.face * 1.6); game.fx.push({ k: 'tag', x: h.x, y: h.y - 195, t: 0, life: .8, txt: 'DISLODGED!' }); }

function p3Dislodge(h) { setState(h, 'p3dis'); h.stabbed = h.kicked = false; h.leapt = false; }
function p3Held(e, dt) {
  // the held enemy stands where the dummy is on her sheet, facing away from her (she has them from behind)
  const h = hero;
  if (h.grabbed !== e || !P3_GRABS.has(h.state)) { if (h.grabbed === e) h.grabbed = null; setState(e, 'idle'); e.ca = 'idle'; e.cfi = 0; e.z = 0; e.spin = 0; return; }
  e.heldT += dt; e.vx = 0; e.vy = 0; e.z = 0; e.spin = 0;

// ---------- jump: crouch, rise, peak, land; in the air kick = jump kick, punch = elbow drop ----------
function p3Air(h, dt) {
  const mx = (keys.R ? 1 : 0) - (keys.L ? 1 : 0), my = (keys.D ? 1 : 0) - (keys.U ? 1 : 0);
  jumpQueued = false;
  if (!h.lifted) {
    h.p3ca = 'jump'; h.p3cfi = 0; h.vx = 0; h.vy = 0;
    if (h.st > .07) { h.lifted = true; h.vz = 640; h.z = .01; h.vx = h.jvx; audio.whiff(); dust(h.x, h.y, 3); }
    return true;
  }
  if (!h.airAtk) { h.vx += (mx * h.speed * 1.05 - h.vx) * Math.min(1, dt * 2.5); h.vy = my * h.speed * .4; } else h.vy = 0;
  // (a direction tapped a moment ago counts too, so a quick toward + punch still catches)
  const toward = mx || (h.tapT != null && game.t - h.tapT < .15 ? h.tapDir : 0);
  if (atkQueued === 'punch' && !h.airAtk && toward) {
    const tgt = game.enemies.find(e => p2Grabbable(e) && Math.sign(e.x - h.x) === toward && Math.abs(e.x - h.x) < 150 && Math.abs(e.y - h.y) < 30);
    if (tgt) {
      atkQueued = null; setState(h, 'p3aslam'); h.grabbed = tgt; h.face = toward; h.vx = 0; h.vy = 0; h.vz = 420; h.slammed = false;
      grabLockAt(tgt, h, tgt.face, tgt.x, false);
      setState(tgt, 'pheld'); tgt.vx = 0; tgt.vy = 0; tgt.heldT = 0; tgt.face = h.face;
      audio.grab(); return true;
    }
  }
  if (atkQueued && !h.airAtk) {
    h.airAtk = atkQueued === 'kick' ? 'jkick' : 'edrop'; h.airT = 0; h.hitDone = false; atkQueued = null; audio.whiff();
    if (h.airAtk === 'edrop') { h.vz = Math.min(h.vz, 120); }
  }
  if (h.airAtk) {
    h.airT += dt; h.p3ca = h.airAtk; h.p3cfi = 0;
    if (h.airAtk === 'edrop') {
      // dive elbow-first: drops fast and floors whoever it lands on
      h.vz = Math.max(-1100, h.vz - 2600 * dt); h.vx = h.face * 260;
      if (!h.hitDone) for (const e of game.enemies) {
        if (e.state === 'ko' || e.delay > 0 || e.inv > 0 || e.state === 'pheld' || e.state === 'ptoss') continue;
        const d = (e.x - h.x) * h.face;
        if (d > -10 && d < 90 && Math.abs(e.y - h.y) < 26 && h.z < 120) { h.hitDone = true; if (e.cls) e.poise = 999; damage(e, { dmg: 13, kb: 220, reach: 999, big: true, knock: true }, h); game.fx.push({ k: 'tag', x: e.x, y: e.y - 190, t: 0, life: .6, txt: 'ELBOW DROP!' }); }
      }
    } else {
      h.vz -= 1750 * dt;
      if (!h.hitDone && h.airT > .05 && tryHit(h, { dmg: 12, kb: 300, reach: 140, big: true }, game.enemies)) h.hitDone = true;
    }
  } else {
    h.vz -= 1750 * dt; h.p3ca = 'jump'; h.p3cfi = h.vz > 80 ? 1 : 2;
  }
  h.z += h.vz * dt;
  if (h.z <= 0) {
    h.z = 0; h.vz = 0; h.vx *= h.airAtk === 'edrop' ? .2 : .5;
    if (h.airAtk === 'edrop') { game.shake = Math.max(game.shake, 6); dust(h.x + h.face * 30, h.y, 6); audio.thump(70, .2, .4); }
    setState(h, 'p3jland');
  }
